[www]
user  = www-data
group = www-data

; Listen on TCP (nginx in same container)
listen = 127.0.0.1:9000

; Process management
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Logging
access.log           = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Env passthrough
clear_env = no
