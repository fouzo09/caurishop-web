name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-push

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          [ -z "$VPS_HOST" ]  && echo "::error::VPS_HOST est vide"  && exit 1 || echo "VPS_HOST OK"
          [ -z "$VPS_USER" ]  && echo "::error::VPS_USER est vide"  && exit 1 || echo "VPS_USER OK"
          [ -z "$VPS_PORT" ]  && echo "::error::VPS_PORT est vide"  && exit 1 || echo "VPS_PORT OK"
          [ -z "$VPS_SSH_KEY" ] && echo "::error::VPS_SSH_KEY est vide" && exit 1 || echo "VPS_SSH_KEY OK"

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copier docker-compose.prod.yml
        run: |
          scp -P "$VPS_PORT" \
            docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:${DEPLOY_PATH:-/opt/caurishop}/docker-compose.prod.yml"

      - name: Déployer
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash << EOF
            set -e
            cd "${DEPLOY_PATH:-/opt/caurishop}"

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            export IMAGE_TAG="$IMAGE_TAG"
            export GITHUB_REPOSITORY="$GITHUB_REPOSITORY"

            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan storage:link

            docker image prune -f
            echo "Déploiement terminé — $GITHUB_REPOSITORY:$IMAGE_TAG"
          EOF
