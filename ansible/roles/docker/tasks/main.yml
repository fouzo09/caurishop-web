---
- name: Ajouter la clé GPG Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Ajouter le dépôt Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: Installer Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Démarrer et activer Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Ajouter l'utilisateur deploy au groupe docker
  user:
    name: "{{ deploy_user }}"
    groups: docker
    append: yes

- name: Configurer le daemon Docker (logs + storage)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }
  notify: Redémarrer Docker

- name: Créer le réseau Docker caurishop
  community.docker.docker_network:
    name: caurishop
    state: present
