name: caurishop

services:

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: caurishop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - caurishop

  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-fouzo09/caurishop}:${IMAGE_TAG:-latest}
    container_name: caurishop_app
    restart: unless-stopped
    env_file: .env
    environment:
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      REDIS_CLIENT: ""
    volumes:
      - storage_data:/var/www/html/storage/app/public
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - caurishop

volumes:
  postgres_data:
  storage_data:

networks:
  caurishop:
    driver: bridge
