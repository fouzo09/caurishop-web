name: caurishop

services:
  db:
    image: postgres:16-alpine
    container_name: caurishop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - caurishop

  app:
    image: ghcr.io/fouzo09/caurishop-web:latest
    container_name: caurishop_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - storage_data:/var/www/html/storage/app/public
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - caurishop

volumes:
  postgres_data:
  storage_data:

networks:
  caurishop:
    driver: bridge
