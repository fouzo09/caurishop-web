name: caurishop

services:

  # ── Application ───────────────────────────────────────────────
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-fouzo09/caurishop}:${IMAGE_TAG:-latest}
    container_name: caurishop_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST:          db
      DB_PORT:          5432
      REDIS_HOST:       redis
      QUEUE_CONNECTION: redis
      CACHE_STORE:      redis
      SESSION_DRIVER:   redis
    volumes:
      - storage_data:/var/www/html/storage/app/public
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caurishop

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: caurishop_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${DB_DATABASE}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - caurishop

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: caurishop_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - caurishop

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  caurishop:
    driver: bridge
